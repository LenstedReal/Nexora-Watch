# Nexora Watch: MongoDB + FastAPI backend (+ Caddy: HTTPS, web app, personal site, download page).
#
# Server: updated by GitHub Actions (.github/workflows/deploy.yml). The images are built on GitHub and only
#         pulled here; do NOT run "--build" on the server. Manual restart with the images already present:
#           sudo docker compose --profile tls up -d --no-build
# Local:  docker compose up -d --build                 -> API only on http://localhost:8001
#         docker compose --profile tls up -d --build   -> HTTPS on DOMAIN (web + /api), PERSONAL_DOMAIN and APK_DOMAIN
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    volumes: [mongo-data:/data/db]

  backend:
    image: ghcr.io/lenstedreal/nexora-watch-backend:${NEXORA_TAG:-latest}
    build: ./backend
    restart: unless-stopped
    logging: *logging
    depends_on: [mongo]
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: nexora
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:?set MEDIA_SIGNING_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      OCI_S3_ENDPOINT: ${OCI_S3_ENDPOINT:-}
      OCI_REGION: ${OCI_REGION:-}
      OCI_ACCESS_KEY: ${OCI_ACCESS_KEY:-}
      OCI_SECRET_KEY: ${OCI_SECRET_KEY:-}
      OCI_BUCKET: ${OCI_BUCKET:-}
      WEB_URL: ${WEB_URL:-https://nexora.lenstedreal.info}
      PLAY_URL: ${PLAY_URL:-}
      APK_URL: ${APK_URL:-https://github.com/LenstedReal/Nexora-Watch/releases/latest}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-contact.nexorawatch@protonmail.com}
      MIN_AGE: ${MIN_AGE:-16}
      OWNER_NAME: ${OWNER_NAME:-}
      OWNER_ADDRESS: ${OWNER_ADDRESS:-}
      MEDIA_RETENTION_DAYS: ${MEDIA_RETENTION_DAYS:-7}
      MEDIA_DELETE_AFTER_CLOSE_HOURS: ${MEDIA_DELETE_AFTER_CLOSE_HOURS:-1}
      # Comma lists ("domain|Name" for ALLOWED_SITES). Leave them unset: the defaults live in backend/config.py only,
      # so a list written here can never silently override the one in the code again.
      ALLOWED_SITES: ${ALLOWED_SITES:-}
      BLOCKED_HOSTS: ${BLOCKED_HOSTS:-}
      # Apps whose download taps are counted for the download page (empty = the default in backend/server.py).
      TRACK_APPS: ${TRACK_APPS:-}
    volumes: [media-data:/data/media]
    ports: ["8001:8001"]

  caddy:
    image: ghcr.io/lenstedreal/nexora-watch-web:${NEXORA_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    profiles: [tls]
    restart: unless-stopped
    logging: *logging
    depends_on: [backend]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      PERSONAL_DOMAIN: ${PERSONAL_DOMAIN:-me.lenstedreal.info}
      APK_DOMAIN: ${APK_DOMAIN:-apk.lenstedreal.info}
    ports: ["80:80", "443:443"]
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mongo-data:
  media-data:
  caddy-data:
  caddy-config:
