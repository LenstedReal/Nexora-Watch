name: Android APK

on:
  push:
    branches: [main, nexora-v2]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to attach the APK to a GitHub Release on tags

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      # Repo variables: Settings -> Secrets and variables -> Actions -> Variables
      EXPO_PUBLIC_API_URL: ${{ vars.NEXORA_API_URL }}
      EXPO_PUBLIC_WEB_URL: ${{ vars.NEXORA_WEB_URL }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      # Node 22: unit tests run with --experimental-strip-types. No npm cache (no lockfile committed).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align native module versions with the Expo SDK
        run: npx expo install --fix

      - name: Unit tests (sync engine)
        run: npm test

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # The Expo prebuild template signs the release build with the debug keystore:
      # the APK installs on any phone, but it is NOT suitable for Google Play (needs a real upload keystore).
      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk nexora-watch-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nexora-watch-apk
          path: apps/mobile/nexora-watch-${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/nexora-watch-${{ github.run_number }}.apk
