name: Android (APK + AAB)

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # attach builds to a GitHub Release on tags

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: apps/mobile
    env:
      # Repository variables: Settings -> Secrets and variables -> Actions -> Variables
      EXPO_PUBLIC_API_URL: ${{ vars.NEXORA_API_URL }}
      EXPO_PUBLIC_WEB_URL: ${{ vars.NEXORA_WEB_URL }}
      # InMobi ads. These IDs are not secret (they ship inside the app); a repository variable with the same name
      # overrides them. Set a variable to a single space to build without ads. See docs/ADS.md.
      EXPO_PUBLIC_INMOBI_ACCOUNT_ID: ${{ vars.INMOBI_ACCOUNT_ID || '99e775800ff24fd9b8eed4d405722eec' }}
      EXPO_PUBLIC_INMOBI_BANNER_ID: ${{ vars.INMOBI_BANNER_ID || '10000879796' }}
      EXPO_PUBLIC_INMOBI_INTERSTITIAL_ID: ${{ vars.INMOBI_INTERSTITIAL_ID || '10000879797' }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      # Every build gets a higher versionCode (Google Play requirement). 110000+ > the old 7.x / 1.0 builds.
      - name: Version code
        run: echo "NEXORA_VERSION_CODE=$((110000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align native module versions with the Expo SDK
        run: npx expo install --fix

      - name: Unit tests (sync engine)
        run: npm test

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true

      # Secrets (Settings -> Secrets and variables -> Actions -> Secrets):
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # Without them the build is signed with the debug key (installable, NOT accepted by Google Play).
      - name: Restore upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            echo "NEXORA_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
            echo "Release signing: upload keystore"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret missing - building with the DEBUG key (not for Google Play)"
          fi

      # Push notifications (docs/PUSH.md): secret GOOGLE_SERVICES_JSON = the google-services.json file itself
      # (pasted as is) or its base64. A missing or broken secret never stops the build: push is simply off.
      - name: Restore google-services.json
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          rm -f google-services.json
          if [ -z "$GSJ" ]; then
            echo "::notice::GOOGLE_SERVICES_JSON secret missing - push notifications off"
            exit 0
          fi
          printf '%s' "$GSJ" > gsj.in
          if python3 -c 'import json,sys; json.load(open("gsj.in"))' 2>/dev/null; then
            mv gsj.in google-services.json
          elif tr -d ' \r\n\t' < gsj.in | base64 -d > gsj.out 2>/dev/null && python3 -c 'import json; json.load(open("gsj.out"))' 2>/dev/null; then
            mv gsj.out google-services.json
          fi
          rm -f gsj.in gsj.out
          if [ -f google-services.json ] && python3 -c 'import json; d=json.load(open("google-services.json")); assert any(c["client_info"]["android_client_info"]["package_name"]=="com.lenstedreal.nexorawatch" for c in d["client"])' 2>/dev/null; then
            echo "Push: google-services.json restored"
          else
            rm -f google-services.json
            echo "::warning title=Push::GOOGLE_SERVICES_JSON secret is not a valid google-services.json for com.lenstedreal.nexorawatch (paste the file content as is). Building without push."
          fi

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build APK and AAB
        working-directory: apps/mobile/android
        env:
          NEXORA_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NEXORA_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NEXORA_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Collect outputs
        run: |
          VER=$(node -p "require('./app.json').expo.version")
          mkdir -p ../../dist
          cp android/app/build/outputs/apk/release/app-release.apk "../../dist/nexora-watch-$VER-$NEXORA_VERSION_CODE.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "../../dist/nexora-watch-$VER-$NEXORA_VERSION_CODE.aab"
          ls -la ../../dist

      - name: Verify signature
        run: |
          APK=$(ls ../../dist/*.apk)
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: nexora-watch-android
          path: dist/*
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

      # Keeps https://github.com/LenstedReal/NexoraWatch/releases/latest (linked from the website) pointing at
      # the newest signed APK. Only the APK is public; the AAB is for Play Console and stays in the artifact.
      - name: Publish latest APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.NEXORA_VERSION_CODE }}
          name: Nexora Watch (build ${{ env.NEXORA_VERSION_CODE }})
          make_latest: "true"
          files: dist/*.apk
