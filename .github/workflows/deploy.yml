name: Deploy server (web + API + personal site)

# Every push to main that touches the server side:
#   1) GitHub builds the two images (API, and web app + Caddy + personal site) and pushes them to GHCR,
#   2) the server only pulls them and restarts. Nothing is built on the small VM any more.
# The live version is always visible at https://nexora.lenstedreal.info/version.txt
# Needs repository secrets: DEPLOY_HOST, DEPLOY_SSH_KEY and optionally DEPLOY_USER (default: ubuntu). See docs/DEPLOY.md.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "site/**"
      - "deploy/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one.
concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/lenstedreal/nexora-watch-backend
  WEB_IMAGE: ghcr.io/lenstedreal/nexora-watch-web

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: App version
        id: ver
        run: echo "version=$(jq -r .expo.version apps/mobile/app.json)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: If the build failed
        if: failure()
        run: |
          echo "::error title=Deploy::Imajlar derlenemedi; sunucuya dokunulmadi, canli site eski surumde calismaya devam ediyor. / Image build failed; the server was not touched."

  deploy:
    name: Update the server
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: chk
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::warning title=Deploy::DEPLOY_HOST / DEPLOY_SSH_KEY secret'lari yok; sunucu guncellenmedi (docs/DEPLOY.md). / Secrets are not set — the server was not updated."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull the new images and restart on the server
        id: remote
        if: steps.chk.outputs.ok == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXORA_TAG: ${{ github.sha }}
        run: |
          set +e; set -uo pipefail   # no errexit: the exit code of ssh is handled below
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # The script and its three values travel on stdin, so the token never shows up in a process list.
          { printf 'export GHCR_USER=%q GHCR_TOKEN=%q NEXORA_TAG=%q\n' "$GHCR_USER" "$GHCR_TOKEN" "$NEXORA_TAG"; cat deploy/server-update.sh; } \
            | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
                  -o ServerAliveInterval=15 -o ServerAliveCountMax=8 "$SSH_USER@$HOST" 'bash -s' | tee remote.log
          code=${PIPESTATUS[1]}
          rm -f ~/.ssh/deploy_key
          if [ "$code" = 255 ]; then
            echo "::error title=Deploy::Sunucuya SSH ile baglanilamadi: adres, kullanici ya da DEPLOY_SSH_KEY yanlis olabilir; sunucu kapali da olabilir. / Could not connect to the server over SSH."
          fi
          echo "live=$(sed -n 's/^NEXORA_LIVE=//p' remote.log | tail -1)" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Summary
        if: always()
        env:
          RESULT: ${{ steps.remote.outcome }}
          LIVE: ${{ steps.remote.outputs.live }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            if [ "$RESULT" = "success" ]; then
              echo "### Canlıda: \`$LIVE\`"
              echo "Kontrol: https://nexora.lenstedreal.info/version.txt"
            elif [ "$RESULT" = "skipped" ]; then
              echo "### Sunucu güncellenmedi (secret'lar tanımlı değil)"
              echo "İmajlar hazır: sürüm $VERSION, \`$GITHUB_SHA\`. Kurulum: docs/DEPLOY.md"
            else
              echo "### Güncelleme başarısız"
              echo "Sebep bu sayfadaki kırmızı uyarıda yazıyor. Canlı site bir önceki sürümle çalışmaya devam ediyor olabilir; kontrol: https://nexora.lenstedreal.info/version.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
