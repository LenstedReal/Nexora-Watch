name: NexoraWatch
options:
  bundleIdPrefix: com.lenstedreal
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "7.6.2"
    CURRENT_PROJECT_VERSION: "70602"
    SWIFT_VERSION: "5.9"
targets:
  NexoraWatch:
    type: application
    platform: iOS
    sources:
      - path: NexoraWatch
      - path: ../../packages/localization/locales.json
        buildPhase: resources
    info:
      path: NexoraWatch/Info.plist
      properties:
        CFBundleDisplayName: Nexora Watch
        NEXORA_API_BASE_URL: $(NEXORA_API_BASE_URL)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSPhotoLibraryUsageDescription: Odaya video yüklemek için galerinize erişim gerekir.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lenstedreal.nexorawatch
        NEXORA_API_BASE_URL: https://nexora-stream-5.preview.emergentagent.com
  NexoraWatchTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NexoraWatchTests]
    dependencies:
      - target: NexoraWatch
